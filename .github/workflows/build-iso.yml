name: "Build Aether OS ISO"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-iso:
    name: "Build Archiso Image"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Build ISO in Arch Linux Container"
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -c "
              pacman -Syu --noconfirm archiso git rsync dosfstools libisoburn && \
              ./scripts/build_iso.sh --clean
            "

      - name: "Upload ISO Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-live-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 7

      - name: "Create GitHub Release (Tags Only)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
