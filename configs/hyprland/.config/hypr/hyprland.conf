# ==============================================================================
# Aether OS - Hyprland Window Manager Configuration
# Experiência Wayland dinâmica, minimalista e terminal-first
# ==============================================================================

# Monitores
monitor=,preferred,auto,1

# Inicialização automática de serviços da sessão
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Configurações de Input
input {
    kb_layout = br,us
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# Estilo Visual e Bordas (Paleta Aether)
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(00afff) rgb(0087af) 45deg
    col.inactive_border = rgb(1a202c)
    layout = dwindle
}

# Decoração e Efeitos
decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
    }
    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = rgba(00000040)
    }
}

# Animações
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

# Layout Dwindle
dwindle {
    pseudotile = true
    preserve_split = true
}

# Atalhos de Teclado (Keybindings)
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, rofi -show drun -show-icons
bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen, 0

# Foco de Janelas (Vim-like e Setas)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Gerenciamento de Workspaces (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
