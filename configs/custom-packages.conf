# ==============================================================================
# Aether OS - Lista de Aplicativos e Pacotes Customizados
# ==============================================================================
# Este arquivo permite definir uma lista de programas, navegadores, ferramentas
# e plugins que você deseja que o instalador instale automaticamente logo após
# a conclusão da instalação do sistema base e da interface gráfica.
#
# INSTRUÇÕES DE SEÇÕES:
# - [common]   -> Aplicativos instalados em AMBAS as versões (Plasma e Hyprland).
#                 (Qualquer linha antes da primeira seção também é tratada como comum).
# - [hyprland] -> Aplicativos instalados EXCLUSIVAMENTE no perfil Aether-Hyprland.
# - [plasma]   -> Aplicativos instalados EXCLUSIVAMENTE no perfil Aether-Plasma.
#
# - Você também pode utilizar os arquivos dedicados:
#   configs/custom-packages-hyprland.conf e configs/custom-packages-plasma.conf
#
# - Linhas iniciadas com '#' (comentários) e linhas em branco são ignoradas.
# - Suporta pacotes oficiais do Arch Linux e pacotes do AUR (instalados via Yay).
# ==============================================================================

# ==============================================================================
